name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: apps/mobile
      - run: bun run check

  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: apps/mobile
      - run: bun run e2e
        working-directory: apps/mobile

  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: apps/mobile
      - name: Download the Hermes VM
        run: |
          mkdir -p "$RUNNER_TEMP/hermes"
          gh release download v0.13.0 -R facebook/hermes -p hermes-cli-linux.tar.gz \
            -D "$RUNNER_TEMP/hermes"
          echo "aead6eb0b8f563bb022354352eae32dad96c933330b6c1941b6db17674ca68ae  $RUNNER_TEMP/hermes/hermes-cli-linux.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/hermes/hermes-cli-linux.tar.gz" -C "$RUNNER_TEMP/hermes"
          echo "HERMES=$RUNNER_TEMP/hermes/hermes" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bun run hermes-smoke
        working-directory: apps/mobile
